# bastion 플레이어 권한:
#  - 본인 ns(bastion) 하에서만 Ingress / Service / EndpointSlice 생성
#  - 본인 ns 하의 조회(get/list/watch)
#  - ns app, ns db 로의 권한은 일절 없음(네임스페이스 Role 이므로 교차 ns 는 자동 거부)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: player
  namespace: bastion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: player
  namespace: bastion
rules:
# 본인 ns 조회
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps", "endpoints", "events", "serviceaccounts"]
  verbs: ["get", "list", "watch"]
# Service 생성·조회·정리
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Ingress 생성·조회·정리
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# EndpointSlice 생성·조회·정리
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: player
  namespace: bastion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: player
subjects:
- kind: ServiceAccount
  name: player
  namespace: bastion
