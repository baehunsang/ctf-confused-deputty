apiVersion: v1
kind: Secret
metadata:
  name: flag
  namespace: db
type: Opaque
stringData:
  flag: "flag{ingress_controller_is_a_confused_deputy_across_namespaces}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: db
  labels: { app: db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      nodeSelector:
        ctf-role: db
      containers:
      - name: db
        image: python:3.12-alpine
        command: ["python", "/src/db.py"]
        ports:
        - containerPort: 8080
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: FLAG
          valueFrom:
            secretKeyRef:
              name: flag
              key: flag
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: src
          mountPath: /src
      volumes:
      - name: src
        configMap:
          name: db-src
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: db
spec:
  selector: { app: db }
  ports:
  - name: http
    port: 8080
    targetPort: 8080
