apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
  labels: { app: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      nodeSelector:
        ctf-role: app
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "/src/app.py"]
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: "http://db.db.svc.cluster.local:8080"
        - name: DB_PORT
          value: "8080"
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: src
          mountPath: /src
      volumes:
      - name: src
        configMap:
          name: app-src
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app
spec:
  selector: { app: app }
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# 외부에 노출되는 유일한 엔드포인트: GET /user. /flag 는 없다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-user
  namespace: app
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /user
        pathType: Prefix
        backend:
          service:
            name: app
            port:
              number: 8080
